services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-superchat}
      POSTGRES_USER: ${POSTGRES_USER:-superchat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-superchat}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-superchat} -d ${POSTGRES_DB:-superchat}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-superchat}:${POSTGRES_PASSWORD:-superchat}@db:5432/${POSTGRES_DB:-superchat}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]

volumes:
  postgres_data:
