<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Entrar · Super Chat</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #080b12; color: #f7f8fb; padding: 24px; }
    .card { width: min(100%, 420px); background: #111622; border: 1px solid #242d3e; border-radius: 20px; padding: 30px; box-shadow: 0 30px 80px rgba(0,0,0,.35); }
    .brand { display: flex; gap: 14px; align-items: center; margin-bottom: 28px; }
    .mark { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: #e9eefb; color: #0a1020; font-weight: 800; }
    h1 { font-size: 24px; margin: 0 0 7px; }
    p { margin: 0; color: #96a0b4; line-height: 1.5; }
    form { display: grid; gap: 16px; margin-top: 26px; }
    label { display: grid; gap: 7px; font-size: 13px; color: #c5ccda; }
    input { width: 100%; border: 1px solid #2a3448; border-radius: 11px; background: #0c111c; color: #fff; padding: 12px 13px; font: inherit; outline: none; }
    input:focus { border-color: #6f86b8; box-shadow: 0 0 0 3px rgba(111,134,184,.14); }
    button { border: 0; border-radius: 11px; background: #eef2fb; color: #101727; padding: 12px 16px; font: inherit; font-weight: 750; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    .error { min-height: 20px; margin-top: 14px; color: #ff9ca4; font-size: 13px; }
    .meta { margin-top: 20px; font-size: 12px; color: #68748b; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <div class="mark">SC</div>
      <div>
        <h1>Super Chat</h1>
        <p>Segundo Cérebro · acesso administrativo</p>
      </div>
    </div>

    <form id="login-form" autocomplete="on">
      <label>
        Usuário
        <input id="username" name="username" autocomplete="username" required maxlength="160" autofocus />
      </label>
      <label>
        Senha
        <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024" />
      </label>
      <button id="submit" type="submit">Entrar</button>
    </form>
    <div id="error" class="error" role="alert"></div>
    <div class="meta">Sessão protegida no servidor. Credenciais não são armazenadas no navegador.</div>
  </main>

  <script>
    const form = document.querySelector('#login-form');
    const error = document.querySelector('#error');
    const submit = document.querySelector('#submit');

    function destination() {
      const raw = new URLSearchParams(window.location.search).get('next') || '/app/';
      return raw.startsWith('/') && !raw.startsWith('//') ? raw : '/app/';
    }

    async function statusCheck() {
      try {
        const response = await fetch('/auth/status', { headers: { 'Accept': 'application/json' } });
        if (!response.ok) return;
        const data = await response.json();
        if (!data.auth_enabled || data.authenticated) window.location.replace(destination());
      } catch (_) {}
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      error.textContent = '';
      submit.disabled = true;
      submit.textContent = 'Entrando…';
      try {
        const response = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({
            username: document.querySelector('#username').value,
            password: document.querySelector('#password').value,
          }),
        });
        if (!response.ok) {
          error.textContent = response.status === 401 ? 'Usuário ou senha inválidos.' : 'Não foi possível iniciar a sessão.';
          return;
        }
        window.location.replace(destination());
      } catch (_) {
        error.textContent = 'Falha de comunicação com o servidor.';
      } finally {
        submit.disabled = false;
        submit.textContent = 'Entrar';
      }
    });

    statusCheck();
  </script>
</body>
</html>
